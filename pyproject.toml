[project]
name = "ha-porkbun"
version = "2.0.0"
description = "Home Assistant integration for Porkbun DDNS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2,<3.15"

[tool.pytest.ini_options]
addopts = "-p no:respx"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "contract: tests against Porkbun's credential-free mock API",
    "sandbox: tests against Porkbun's isolated live sandbox API",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90

[tool.uv]
override-dependencies = [
    "cryptography>=50.0.0",
    "PyJWT>=2.12.0",
    "pytest>=9.0.3",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["custom_components/porkbun_ddns/manifest.json:version"]
build_command = "pip install uv && uv lock"
commit_message = "chore(release): {version}"
tag_format = "v{version}"
assets = ["uv.lock"]

[tool.semantic_release.commit_parser_options]
patch_tags = ["fix", "perf", "build"]
other_allowed_tags = ["chore", "ci", "docs", "style", "refactor", "test"]

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.changelog]
mode = "init"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
token = { env = "GITHUB_TOKEN" }

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "pytest_homeassistant.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
disable_error_code = ["arg-type", "type-arg"]

[dependency-groups]
dev = [
    "coverage>=7.13",
    "mypy>=1.15",
    "pytest-homeassistant==2026.11.3",
    "ruff>=0.9",
]
